#伪指令映射
#倍高
doubleHeight=^2
#倍宽
doubleWidth=^3
#倍高倍宽
doubleHW=^2^3
#取消倍高
cancelHeight=^a
#取消倍宽
cancelWidth=^b
#用户定义指令1
userDefined_order1=^6
#用户定义指令2
userDefined_order2=^f
#用户定义指令3
userDefined_order3=^g
#用户定义指令4
userDefined_order4=^h
#用户定义指令5
userDefined_order5=^k
#取消所有指令
cancelAllOrders=^a^f^e

#电子档案文件格式映射配置
#倍高字体
doubleHeight_font=11pt
#倍宽字体
doubleWidth_font=11pt
#倍高倍宽字体
doubleHW_font=11pt
#用户定义指令1字号
