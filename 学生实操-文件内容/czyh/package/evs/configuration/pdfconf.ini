#用户定义指令4字号
userDefined_order4_font=11pt
#用户定义指令5字号
userDefined_order5_font=11pt

#打印相关配置
#页边距(左)
leftMargin=10
#页边距(上)
topMargin=10
#中文字体
chFont=宋体,10
#西文字体
enFont=Roman,10
#列距
col_span=15,0
#行距
row_span=0
#倍高指令调整值
